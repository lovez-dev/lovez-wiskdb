name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, safe]
        platform: [linux-x86_64, linux-arm64, windows-x86_64, windows-arm64, macos-arm64]
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-x86_64
            runner: windows-2025
          - platform: windows-arm64
            runner: windows-11-arm
          - platform: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Check formatting
        if: matrix.platform == 'linux-x86_64' && matrix.mode == 'debug'
        run: zig build fmt
      - name: Build and test Debug
        if: matrix.mode == 'debug'
        run: zig build test examples
      - name: Build and test ReleaseSafe
        if: matrix.mode == 'safe'
        run: zig build test examples --release=safe
